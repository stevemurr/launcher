name: Launcher

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    CLANG_ENABLE_MODULES: YES

packages:
  LibGhosttySPM:
    url: https://github.com/stevemurr/libghostty-spm
    revision: ca4cffd668f958e1fe5da9cbf31f460f3ba01533

targets:
  Launcher:
    type: application
    platform: macOS
    sources:
      - path: Sources/Launcher
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevemurr.Launcher
        PRODUCT_NAME: Launcher
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: LibGhosttySPM
        product: GhosttyTerminal

  LauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LauncherTests
    dependencies:
      - target: Launcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevemurr.LauncherTests
        GENERATE_INFOPLIST_FILE: YES

  LauncherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/LauncherUITests
    dependencies:
      - target: Launcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevemurr.LauncherUITests
        TEST_TARGET_NAME: Launcher
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Launcher:
    build:
      targets:
        Launcher: all
        LauncherTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LauncherTests

  LauncherUITests:
    build:
      targets:
        Launcher: all
        LauncherUITests: [test]
    test:
      targets:
        - name: LauncherUITests
